services:
  app:
    image: node:24-bookworm-slim
    build: !reset null
    working_dir: /app
    command: >-
      sh -lc '
        LOCK_HASH_FILE=/app/node_modules/.package-lock.hash;
        CURRENT_HASH=$$(sha256sum /app/package-lock.json | cut -d" " -f1);
        SAVED_HASH=$$(cat $$LOCK_HASH_FILE 2>/dev/null || true);
        if [ "$$CURRENT_HASH" != "$$SAVED_HASH" ]; then
          npm install --no-audit --no-fund &&
          printf "%s" "$$CURRENT_HASH" > "$$LOCK_HASH_FILE";
        fi;
        exec npm run dev
      '
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      APP_NAME: NetManage
      MAIL_MAILER: smtp
      MAIL_FROM_ADDRESS: no-reply@netmanage.local
      MAIL_FROM_NAME: NetManage
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  scheduler:
    image: node:24-bookworm-slim
    build: !reset null
    working_dir: /app
    command: >-
      sh -lc '
        LOCK_HASH_FILE=/app/node_modules/.package-lock.hash;
        CURRENT_HASH=$$(sha256sum /app/package-lock.json | cut -d" " -f1);
        SAVED_HASH=$$(cat $$LOCK_HASH_FILE 2>/dev/null || true);
        if [ "$$CURRENT_HASH" != "$$SAVED_HASH" ]; then
          npm install --no-audit --no-fund &&
          printf "%s" "$$CURRENT_HASH" > "$$LOCK_HASH_FILE";
        fi;
        while true; do
          node ace tickets:auto-close;
          sleep 3600;
        done
      '
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      APP_NAME: NetManage
      MAIL_MAILER: smtp
      MAIL_FROM_ADDRESS: no-reply@netmanage.local
      MAIL_FROM_NAME: NetManage
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
